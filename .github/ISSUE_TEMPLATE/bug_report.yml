name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, or a failing test.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Addon, Statamic and PHP versions.
      placeholder: "vulpo/cookies 1.0.0, Statamic 6.2, PHP 8.4"
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Consent view
      options:
        - The packaged one
        - A published or custom one
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: caching
    attributes:
      label: Caching
      options:
        - label: The site uses static caching or a full-page cache
